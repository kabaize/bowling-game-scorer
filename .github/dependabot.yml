version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/bowling_api"
    target-branch: "develop"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/bowling_ui"
    target-branch: "develop"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/bowling_api"
    target-branch: "develop"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/bowling_ui"
    target-branch: "develop"
    schedule:
      interval: "monthly"
